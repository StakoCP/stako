name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build Web UI
        working-directory: web
        run: npm ci && npx astro check && npm run build
      - name: Build multi-arch Go binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o dist/stako-core-linux-$arch ./cmd/stako-core
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o dist/stako-agent-linux-$arch ./cmd/stako-agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o dist/stako-linux-$arch ./cmd/stako
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
