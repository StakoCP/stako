name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build Web UI
        working-directory: web
        run: npm ci && npx astro check && npm run build
      - name: Build multi-arch Go binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/stako-core-linux-$arch ./cmd/stako-core
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/stako-agent-linux-$arch ./cmd/stako-agent
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/stako-linux-$arch ./cmd/stako
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
